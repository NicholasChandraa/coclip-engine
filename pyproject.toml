[project]
name = "engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "arq>=0.27.0",
    "ctranslate2>=4.7.0",
    "fastapi>=0.128.0",
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "langchain>=1.2.8",
    "langchain-core>=1.2.8",
    "langchain-google-genai>=4.2.0",
    "langgraph>=1.0.7",
    "python-dotenv>=1.2.1",
    "python-multipart>=0.0.22",
    "redis>=5.3.1",
    "rich>=14.3.2",
    "uvicorn>=0.40.0",
    "whisperx>=3.7.6",
    "yt-dlp>=2026.1.31",
    "torch>=2.6.0,<2.8",
    "torchvision>=0.21.0,<0.22",
    "torchaudio>=2.6.0,<2.8",
    "sqlalchemy",
    "asyncpg",
]

# Override whisperx's torch requirements to use our compatible versions
[tool.uv]
override-dependencies = [
    "torch>=2.6.0,<2.8",
    "torchvision>=0.21.0,<0.22",
    "torchaudio>=2.6.0,<2.8",
]
